<!DOCTYPE html>
<html>
<head>
    <title>Affirm Account</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/loader.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Global Loader -->
    <div class="loader-overlay">
        <div class="loader"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Affirm Account</h1>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form id="affirmAccountForm">
                    <div class="mb-3">
                        <label for="accountId" class="form-label">Account ID</label>
                        <input type="text" class="form-control" id="accountId" name="accountId" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Affirm Account</button>
                </form>
            </div>
        </div>

        <div id="responseContainer" class="response-container" style="display: none;">
            <h3>Response:</h3>
            <pre id="responseArea"></pre>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('affirmAccountForm');
            const submitBtn = document.getElementById('submitBtn');
            const accountIdInput = document.getElementById('accountId');
            const responseContainer = document.getElementById('responseContainer');
            const responseArea = document.getElementById('responseArea');
            const loaderOverlay = document.querySelector('.loader-overlay');

            // Function to show/hide loader
            function toggleLoader(show) {
                if (show) {
                    loaderOverlay.classList.add('active');
                    form.classList.add('loading');
                    submitBtn.disabled = true;
                } else {
                    loaderOverlay.classList.remove('active');
                    form.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            }

            // Function to get stored account ID
            function getStoredAccountId() {
                try {
                    // First try localStorage
                    const localData = localStorage.getItem('createAccountResponse');
                    if (localData) {
                        const parsedLocalData = JSON.parse(localData);
                        if (parsedLocalData?.data?.account?.accountId) {
                            console.log('Found account ID in localStorage');
                            return parsedLocalData.data.account.accountId;
                        }
                    }

                    // If not in localStorage, try localStorage
                    const sessionData = localStorage.getItem('createAccountResponse');
                    if (sessionData) {
                        const parsedSessionData = JSON.parse(sessionData);
                        if (parsedSessionData?.data?.account?.accountId) {
                            console.log('Found account ID in localStorage');
                            return parsedSessionData.data.account.accountId;
                        }
                    }

                    return null;
                } catch (error) {
                    console.error('Error reading from storage:', error);
                    return null;
                }
            }

            // Pre-fill account ID if available
            const storedAccountId = getStoredAccountId();
            if (storedAccountId) {
                accountIdInput.value = storedAccountId;
            }

            // Handle form submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                toggleLoader(true);
                responseContainer.style.display = 'none';

                try {
                    const response = await fetch('/affirmAccount', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            accountId: accountId,
                            agreementIds: agreementIds
                        })
                    });

                    const result = await response.json();
                    responseArea.textContent = JSON.stringify(result, null, 2);
                    responseContainer.style.display = 'block';

                    if (!response.ok) {
                        throw new Error(result.error?.message || 'Failed to affirm account');
                    }

                    // Store the response
                    localStorage.setItem('affirmAccountResponse', JSON.stringify(result));

                } catch (error) {
                    console.error('Error:', error);
                    responseArea.textContent = JSON.stringify({
                        success: false,
                        error: {
                            message: error.message
                        }
                    }, null, 2);
                    responseContainer.style.display = 'block';
                } finally {
                    toggleLoader(false);
                }
            });
        });
    </script>
</body>
</html>
