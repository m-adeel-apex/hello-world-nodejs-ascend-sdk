<!DOCTYPE html>
<html>

<head>
    <title>Trade Booking</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Trade Booking</h1>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="tradeBookingForm">
                    <div class="form-group mb-3">
                        <label for="accountIdInput" class="form-label">Account ID:</label>
                        <input type="text" id="accountIdInput" class="form-control" required>
                        <div class="form-text">Enter the Account ID for the trade booking.</div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Trade</button>
                </form>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h3>Request Payload</h3>
                <textarea id="requestPayload" readonly class="form-control" rows="10"></textarea>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h3>Response</h3>
                <textarea id="responseData" readonly class="form-control" rows="10" style="display: none;"></textarea>
            </div>
        </div>
    </div>

    <script>
        // Function to prefill account ID from localStorage
        function prefillAccountId() {
            const accountData = localStorage.getItem('createAccountResponse');
            if (accountData) {
                try {
                    const parsedAccountData = JSON.parse(accountData);
                    const accountId = parsedAccountData?.data?.account?.accountId;
                    if (accountId) {
                        document.getElementById('accountIdInput').value = accountId;
                        console.log('Prefilled Account ID:', accountId);
                    }
                } catch (error) {
                    console.error('Error parsing account data from localStorage:', error);
                }
            } else {
                console.log('No createAccountResponse found in localStorage');
            }
        }

        // Prefill account ID when page loads
        prefillAccountId();

        // Fetch and display the payload when page loads
        fetch('/tradeBooking/payload')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                document.getElementById('requestPayload').value = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                console.error('Error loading payload:', err);
                document.getElementById('requestPayload').value = 'Error loading payload: ' + err.message;
            });

        // Form submission handler
        document.getElementById('tradeBookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const accountId = document.getElementById('accountIdInput').value.trim();
            const responseArea = document.getElementById('responseData');
            
            if (!accountId) {
                alert('Please enter an Account ID');
                return;
            }

            // Hide response area and show loading message
            responseArea.style.display = 'none';
            responseArea.value = 'Sending request...';

            try {
                const response = await fetch('/tradeBooking', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        accountId: accountId
                    })
                });

                const result = await response.json();

                // Show response area and populate with result
                responseArea.style.display = 'block';
                
                if (result.success) {
                    responseArea.value = JSON.stringify(result.data, null, 2);
                    localStorage.setItem('tradeBookingResponse', JSON.stringify(result));
                } else {
                    responseArea.value = 'Error: ' + JSON.stringify(result.error, null, 2);
                }
            } catch (error) {
                console.error('Error creating trade:', error);
                // Show response area with error message
                responseArea.style.display = 'block';
                responseArea.value = 'Error: ' + error.message;
            }
        });
    </script>
</body>

</html>
