<!DOCTYPE html>
<html>
<head>
    <title>Affirm Single Page</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/loader.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Global Loader -->
    <div class="loader-overlay">
        <div class="loader"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Affirm Account</h1>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>Affirm Account</h3>
                    </div>
                    <div class="card-body">
                        <form id="affirmAccountForm">
                            <div class="mb-3">
                                <label for="accountId" class="form-label">Account ID</label>
                                <input type="text" class="form-control" id="accountId" name="accountId" required>
                            </div>
                            <div class="mb-3">
                                <label for="agreementIds" class="form-label">Agreement IDs (comma-separated)</label>
                                <input type="text" class="form-control" id="agreementIds" name="agreementIds" required>
                                <div class="form-text">Enter one or more agreement IDs separated by commas</div>
                            </div>
                            <button type="submit" class="btn btn-primary" id="affirmAccountBtn">Affirm Account</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Response Container -->
        <div id="responseContainer" class="response-container" style="display: none;">
            <h3>Response:</h3>
            <pre id="responseArea"></pre>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const affirmAccountForm = document.getElementById('affirmAccountForm');
            const affirmAccountBtn = document.getElementById('affirmAccountBtn');
            const accountIdInput = document.getElementById('accountId');
            const agreementIdsInput = document.getElementById('agreementIds');
            const responseContainer = document.getElementById('responseContainer');
            const responseArea = document.getElementById('responseArea');
            const loaderOverlay = document.querySelector('.loader-overlay');

            // Function to show/hide loader
            function toggleLoader(show) {
                if (show) {
                    loaderOverlay.classList.add('active');
                    affirmAccountForm.classList.add('loading');
                    affirmAccountBtn.disabled = true;
                } else {
                    loaderOverlay.classList.remove('active');
                    affirmAccountForm.classList.remove('loading');
                    affirmAccountBtn.disabled = false;
                }
            }

            // Function to display response
            function displayResponse(data) {
                responseArea.textContent = JSON.stringify(data, null, 2);
                responseContainer.style.display = 'block';
            }

            // Function to get stored account ID
            function getStoredAccountId() {
                try {
                    const localData = localStorage.getItem('createAccountResponse');
                    if (localData) {
                        const parsedLocalData = JSON.parse(localData);
                        if (parsedLocalData?.data?.account?.accountId) {
                            return parsedLocalData.data.account.accountId;
                        }
                    }
                    return null;
                } catch (error) {
                    console.error('Error reading from storage:', error);
                    return null;
                }
            }

            function getStoredAgreementId() {
                try {
                    const localData = localStorage.getItem('enrollAccountResponse');
                    if (localData) {
                        const parsedLocalData = JSON.parse(localData);
                        // Get all agreement IDs from the response
                        const agreements = parsedLocalData?.data?.enrollAccountResponse?.agreements || [];
                        if (agreements.length > 0) {
                            // Return all agreement IDs joined with commas
                            return agreements.map(agreement => agreement.agreementId).join(',');
                        }
                    }
                    return null;
                } catch (error) {
                    console.error('Error reading from storage:', error);
                    return null;
                }
            }

            // Pre-fill account ID if available
            const storedAccountId = getStoredAccountId();
            if (storedAccountId) {
                accountIdInput.value = storedAccountId;
            }

            const storedAgreementId = getStoredAgreementId();
            if (storedAgreementId) {
                agreementIdsInput.value = storedAgreementId;
            }

            // Handle Affirm Account form submission
            affirmAccountForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                toggleLoader(true);
                responseContainer.style.display = 'none';

                try {
                    const agreementIdsInput = document.getElementById('agreementIds').value;
                    // Split by comma and clean up each ID
                    const agreementIds = agreementIdsInput.split(',')
                        .map(id => id.trim())
                        .filter(id => id)
                        .map(id => id.replace(/^["']|["']$/g, '')); // Remove any surrounding quotes

                    const response = await fetch('/affirmAccount', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        accountId: accountIdInput.value,
                        body: JSON.stringify({
                            accountAgreementIds: agreementIds
                        })
                    });

                    const result = await response.json();
                    displayResponse(result);

                    if (!response.ok) {
                        throw new Error(result.error?.message || 'Failed to affirm account');
                    }

                    if (result.success) {
                        localStorage.setItem('affirmAccountResponse', JSON.stringify(result));
                    }
                } catch (error) {
                    console.error('Error:', error);
                    displayResponse({
                        success: false,
                        error: {
                            message: error.message
                        }
                    });
                } finally {
                    toggleLoader(false);
                }
            });
        });
    </script>
</body>
</html>
