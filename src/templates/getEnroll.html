<!DOCTYPE html>
<html>
<head>
    <title>Direct Account Enrollment</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/loader.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Global Loader -->
    <div class="loader-overlay">
        <div class="loader"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Direct Account Enrollment</h1>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>

        <div class="card">
            <div class="card-body">
                <h3>Account Information</h3>
                <div class="mb-3">
                    <label for="accountIdInput" class="form-label">Account ID</label>
                    <input type="text" id="accountIdInput" class="form-control" placeholder="Enter Account ID">
                    <div class="form-text">You can enter the account ID manually or it will be loaded from your previous account creation.</div>
                </div>
                <div class="mb-3">
                    <label for="principalApproverIdInput" class="form-label">Principal Approver ID</label>
                    <input type="text" id="principalApproverIdInput" class="form-control" value="01JHG8NGTPWEJMQAB53HCANGEM">
                </div>
                <button id="enrollBtn" class="btn btn-primary" onclick="enrollAccount()">Enroll Account</button>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h3>Response</h3>
                <pre id="responseArea" class="bg-light p-3 rounded"></pre>
            </div>
        </div>
    </div>

    <script>
        const loaderOverlay = document.querySelector('.loader-overlay');
        const enrollBtn = document.getElementById('enrollBtn');
        const responseArea = document.getElementById('responseArea');

        // Load account ID from localStorage
        function loadAccountId() {
            try {
                const accountData = localStorage.getItem('createAccountResponse');
                if (accountData) {
                    const parsedAccountData = JSON.parse(accountData);
                    if (parsedAccountData?.data?.account?.accountId) {
                        // Pre-fill the input field with the account ID from localStorage
                        document.getElementById('accountIdInput').value = parsedAccountData.data.account.accountId;
                    }
                }
            } catch (error) {
                console.error('Error loading account ID:', error);
            }
        }

        // Load account ID when page loads
        loadAccountId();

        function toggleLoader(show) {
            if (show) {
                loaderOverlay.classList.add('active');
                enrollBtn.disabled = true;
            } else {
                loaderOverlay.classList.remove('active');
                enrollBtn.disabled = false;
            }
        }

        async function enrollAccount() {
            const accountId = document.getElementById('accountIdInput').value.trim();
            if (!accountId) {
                responseArea.textContent = 'Error: Please enter an Account ID';
                return;
            }

            const principalApproverId = document.getElementById('principalApproverIdInput').value;
            if (!principalApproverId) {
                responseArea.textContent = 'Error: No principal approver ID provided';
                return;
            }

            toggleLoader(true);
            responseArea.textContent = 'Enrolling account...';

            try {
                const response = await fetch('/enrollAccount', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        accountId: accountId,
                        principalApproverId: principalApproverId,
                        type: "REGISTRATION_INDIVIDUAL",
                        consentMethod: "ESIGNATURE"
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    responseArea.textContent = JSON.stringify(result.data, null, 2);
                    // Store enrollment response for affirmation step
                    localStorage.setItem('enrollAccountResponse', JSON.stringify(result));
                } else {
                    responseArea.textContent = 'Error: ' + JSON.stringify(result.error, null, 2);
                }
            } catch (error) {
                console.error('Error:', error);
                responseArea.textContent = 'Error enrolling account: ' + error.message;
            } finally {
                toggleLoader(false);
            }
        }
    </script>
</body>
</html>
