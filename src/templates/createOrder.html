<!DOCTYPE html>
<html>

<head>
    <title>Create Order</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Create Order</h1>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>

        <div class="row">
            <!-- Create Order Form -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3>Create Order</h3>
                        <form id="createOrderForm">
                            <div class="form-group mb-3">
                                <label for="accountIdInput" class="form-label">Account ID:</label>
                                <input type="text" id="accountIdInput" class="form-control" required>
                                <div class="form-text">Enter the Account ID for the order creation.</div>
                            </div>
                            <button type="submit" class="btn btn-primary">Create Order</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Get Order Form -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3>Get Order Details</h3>
                        <form id="getOrderForm">
                            <div class="form-group mb-3">
                                <label for="getOrderAccountId" class="form-label">Account ID:</label>
                                <input type="text" id="getOrderAccountId" class="form-control" required>
                            </div>
                            <div class="form-group mb-3">
                                <label for="orderIdInput" class="form-label">Order ID:</label>
                                <input type="text" id="orderIdInput" class="form-control" required>
                                <div class="form-text">Enter the Order ID to retrieve details.</div>
                            </div>
                            <button type="submit" class="btn btn-success">Get Order</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h3>Request Payload</h3>
                <textarea id="requestPayload" readonly class="form-control" rows="10"></textarea>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h3>Response</h3>
                <textarea id="responseData" readonly class="form-control" rows="10" style="display: none;"></textarea>
            </div>
        </div>
    </div>

    <script>
        // Function to prefill account ID from localStorage
        function prefillAccountId() {
            const accountData = localStorage.getItem('createAccountResponse');
            if (accountData) {
                try {
                    const parsedAccountData = JSON.parse(accountData);
                    const accountId = parsedAccountData?.data?.account?.accountId;
                    if (accountId) {
                        document.getElementById('accountIdInput').value = accountId;
                        document.getElementById('getOrderAccountId').value = accountId;
                        console.log('Prefilled Account ID:', accountId);
                    }
                } catch (error) {
                    console.error('Error parsing account data from localStorage:', error);
                }
            } else {
                console.log('No createAccountResponse found in localStorage');
            }
        }

        // Prefill account ID when page loads
        prefillAccountId();

        // Fetch and display the payload when page loads
        fetch('/createOrder/payload')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                document.getElementById('requestPayload').value = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                console.error('Error loading payload:', err);
                document.getElementById('requestPayload').value = 'Error loading payload: ' + err.message;
            });

        // Create Order Form submission handler
        document.getElementById('createOrderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const accountId = document.getElementById('accountIdInput').value.trim();
            const responseArea = document.getElementById('responseData');
            
            if (!accountId) {
                alert('Please enter an Account ID');
                return;
            }

            // Hide response area and show loading message
            responseArea.style.display = 'none';
            responseArea.value = 'Creating order...';

            try {
                const response = await fetch('/createOrder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        accountId: accountId
                    })
                });

                const result = await response.json();

                // Show response area and populate with result
                responseArea.style.display = 'block';
                
                if (result.success) {
                    responseArea.value = JSON.stringify(result.data, null, 2);
                    localStorage.setItem('createOrderResponse', JSON.stringify(result));
                    
                    // If order was created successfully, prefill the order ID for getOrder
                    if (result.data && result.data.order && result.data.order.orderId) {
                        document.getElementById('orderIdInput').value = result.data.order.orderId;
                    }
                } else {
                    responseArea.value = 'Error: ' + JSON.stringify(result.error, null, 2);
                }
            } catch (error) {
                console.error('Error creating order:', error);
                // Show response area with error message
                responseArea.style.display = 'block';
                responseArea.value = 'Error: ' + error.message;
            }
        });

        // Get Order Form submission handler
        document.getElementById('getOrderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const accountId = document.getElementById('getOrderAccountId').value.trim();
            const orderId = document.getElementById('orderIdInput').value.trim();
            const responseArea = document.getElementById('responseData');
            
            if (!accountId) {
                alert('Please enter an Account ID');
                return;
            }
            
            if (!orderId) {
                alert('Please enter an Order ID');
                return;
            }

            // Hide response area and show loading message
            responseArea.style.display = 'none';
            responseArea.value = 'Getting order details...';

            try {
                const response = await fetch('/createOrder/getOrder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        accountId: accountId,
                        orderId: orderId
                    })
                });

                const result = await response.json();

                // Show response area and populate with result
                responseArea.style.display = 'block';
                
                if (result.success) {
                    responseArea.value = JSON.stringify(result.data, null, 2);
                    localStorage.setItem('getOrderResponse', JSON.stringify(result));
                } else {
                    responseArea.value = 'Error: ' + JSON.stringify(result.error, null, 2);
                }
            } catch (error) {
                console.error('Error getting order:', error);
                // Show response area with error message
                responseArea.style.display = 'block';
                responseArea.value = 'Error: ' + error.message;
            }
        });
    </script>
</body>

</html>
