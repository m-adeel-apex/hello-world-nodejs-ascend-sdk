<!DOCTYPE html>
<html>
<head>
    <title>Create Bank Relationship Mobile</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/iphone.css">
    <link rel="stylesheet" href="/assets/styles/mobileApp.css">
    <link rel="stylesheet" href="/assets/styles/loader.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <!-- iPhone Section -->
        <div class="iphone-section">
            <div class="iphone-frame">
                <div class="iphone-screen">
                    <div class="status-bar">
                        <span>9:41</span>
                        <span>Bank Relationship</span>
                        <span>100%</span>
                    </div>
                
                    
                    <div class="app-content">
                        <div class="header">
                            <h1>Create Bank Relationship</h1>
                        </div>

                        <div class="form-container">
                            <!-- Account Info Display -->
                            <div id="accountInfo" class="info-card" style="display: none;">
                                <h6>📋 Account Information</h6>
                                <div class="info-row">
                                    <span class="info-label">Account ID:</span>
                                    <span class="form-control" id="accountIdDisplay"></span>
                                </div>
                            </div>
                            
                            <!-- Bank Account Form -->
                            <div class="form-group">
                                <label for="routingNumber">Routing Number</label>
                                <input type="text" class="form-control" id="routingNumber" placeholder="Enter routing number" readonly>
                            </div>
                            
                            <div class="form-group">
                                <label for="accountNumber">Account Number</label>
                                <input type="text" class="form-control" id="accountNumber" placeholder="Enter account number" readonly>
                            </div>
                            
                            <div class="form-group">
                                <label for="accountType">Account Type</label>
                                <select class="form-control" id="accountType">
                                    <option value="Checking">Checking</option>
                                    <option value="Savings">Savings</option>
                                </select>
                            </div>
                            
                            <button class="btn btn-primary" id="createBtn" onclick="createBankRelationship()">
                                Create Bank Relationship
                            </button>

                            <div class="loading" id="loading">
                                <div class="spinner"></div>
                                <div>Creating Bank Relationship...</div>
                            </div>

                            <!-- Success Display Section -->
                            <div class="success-display" id="successDisplay" style="display: none;">
                                <div class="card">
                                    <div class="card-header text-center">
                                        <h6 style="margin: 0; color: #28a745;">✅ Bank Relationship Created Successfully!</h6>
                                    </div>
                                    <div class="card-body">
                                        <div id="successContent"></div>
                                        <div class="d-flex gap-2 mt-15">
                                            <button class="btn btn-success" onclick="goToVerifyMicroDeposits()" style="flex: 1;">
                                                Verify Micro Deposits →
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <a href="/createAccountMobile" class="back-button">← Back</a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Debug Section -->
        <div class="debug-section">
            <h3>Request & Response Debug</h3>
            
            <div class="form-group">
                <div class="request-header" id="requestHeader">Request Payload</div>
                <textarea id="requestPayload" readonly class="request-content" rows="8"></textarea>
            </div>

            <div class="response-container" id="responseContainer">
                <div class="response-header" id="responseHeader">Response</div>
                <div class="response-content" id="responseContent"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Function to display Account information
        function displayAccountInfo() {
            const accountId = localStorage.getItem('accountId');
            if (accountId) {
                document.getElementById('accountInfo').style.display = 'block';
                document.getElementById('accountIdDisplay').textContent = accountId;
            }
        }

        // Fetch and display the payload when page loads
        fetch('/createBankRelationshipMobile/payload')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                // Populate form fields
                if (data.bankAccount) {
                    document.getElementById('routingNumber').value = data.bankAccount.routingNumber || '';
                    document.getElementById('accountNumber').value = data.bankAccount.accountNumber || '';
                    document.getElementById('accountType').value = data.bankAccount.accountType || 'Checking';
                }
                
                document.getElementById('requestPayload').value = JSON.stringify(data, null, 2);
                
                // Display Account information
                displayAccountInfo();
            })
            .catch(err => {
                console.error('Error loading payload:', err);
                document.getElementById('requestPayload').value = 'Error loading payload: ' + err.message;
            });

        async function createBankRelationship() {
            const createBtn = document.getElementById('createBtn');
            const loading = document.getElementById('loading');
            const responseContainer = document.getElementById('responseContainer');
            const responseHeader = document.getElementById('responseHeader');
            const responseContent = document.getElementById('responseContent');
            const successDisplay = document.getElementById('successDisplay');

            // Show loading, hide form and success display
            createBtn.disabled = true;
            loading.style.display = 'block';
            successDisplay.style.display = 'none';
            responseContainer.style.display = 'none';

            try {
                let accountId = JSON.parse(localStorage.getItem('createAccountResponse'));
                console.log("Account ID: ", accountId.data.account.accountId);
                accountId = accountId.data.account.accountId;
                
                if (!accountId) {
                    throw new Error('No account ID found. Please create an account first.');
                }

                // Get the current payload from the textarea
                const payloadText = document.getElementById('requestPayload').value;
                const payload = JSON.parse(payloadText);

                // Update payload with form values
                if (payload.bankAccount) {
                    payload.bankAccount.routingNumber = document.getElementById('routingNumber').value;
                    payload.bankAccount.accountNumber = document.getElementById('accountNumber').value;
                    payload.bankAccount.accountType = document.getElementById('accountType').value;
                }

                const response = await fetch('/createBankRelationshipMobile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        accountId: accountId,
                        ...payload
                    })
                });

                const result = await response.json();

                // Hide loading
                loading.style.display = 'none';

                if (result.success) {
                    // Extract Bank Relationship ID and Status from the response
                    const bankRelationshipId = result.data?.bankAccount?.accountNumber || result.data?.id || 'N/A';
                    const bankRelationshipStatus = result.data?.state?.state || result.data?.status || result.data?.status || 'N/A';
                    
                    console.log("Bank Relationship ID: ", bankRelationshipId);
                    console.log("Bank Relationship Status: ", bankRelationshipStatus);
                    
                    // Hide create button and show success display
                    createBtn.style.display = 'none';
                    
                    // Show success display with bank relationship details
                    successDisplay.style.display = 'block';
                    document.getElementById('successContent').innerHTML = `
                        <div class="form-group">
                            <label class="form-label">Bank Relationship ID:</label>
                            <div class="form-label">${bankRelationshipId}</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Status:</label>
                            <div class="form-label">${bankRelationshipStatus}</div>
                        </div>
                    `;
                    
                    // Show response in debug panel
                    responseContainer.style.display = 'block';
                    responseHeader.textContent = '✅ Success';
                    responseHeader.className = 'response-header success';
                    responseContent.textContent = JSON.stringify(result.data, null, 2);
                    localStorage.setItem('createBankRelationshipResponse', JSON.stringify(result));
                } else {
                    // Show error in debug panel
                    responseContainer.style.display = 'block';
                    responseHeader.textContent = '❌ Error';
                    responseHeader.className = 'response-header error';
                    responseContent.textContent = JSON.stringify(result.error, null, 2);
                }
            } catch (error) {
                console.error('Error creating bank relationship:', error);
                
                // Hide loading, show error
                loading.style.display = 'none';
                responseContainer.style.display = 'block';
                responseHeader.textContent = '❌ Error';
                responseHeader.className = 'response-header error';
                responseContent.textContent = 'Error: ' + error.message;
            } finally {
                createBtn.disabled = false;
            }
        }

        function goToVerifyMicroDeposits() {
            // Redirect to the Verify Micro Deposits page
            window.location.href = '/verifyMicroDeposits';
        }
    </script>
</body>
</html>
