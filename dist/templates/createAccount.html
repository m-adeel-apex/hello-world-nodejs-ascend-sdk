<!DOCTYPE html>
<html>

<head>
    <title>Create Account</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/loader.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Global Loader -->
    <div class="loader-overlay">
        <div class="loader"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Create Account</h1>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3>Request Payload</h3>
                <textarea id="requestPayload" readonly class="form-control mb-3"></textarea>
                <button class="btn btn-primary" id="createAccountBtn" onclick="createAccount()">Create Account</button>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3>Response</h3>
                <textarea id="responseData" readonly class="form-control mb-3"></textarea>
            </div>
        </div>
    </div>

    <script>
        const loaderOverlay = document.querySelector('.loader-overlay');
        const createAccountBtn = document.getElementById('createAccountBtn');

        function toggleLoader(show) {
            if (show) {
                loaderOverlay.classList.add('active');
                createAccountBtn.disabled = true;
            } else {
                loaderOverlay.classList.remove('active');
                createAccountBtn.disabled = false;
            }
        }

        // Fetch and display the payload when page loads
        fetch('../assets/data/createAccount.json')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                document.getElementById('requestPayload').value = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                console.error('Error loading payload:', err);
                document.getElementById('requestPayload').value = 'Error loading payload: ' + err.message;
            });

        async function createAccount() {
            const responseArea = document.getElementById('responseData');
            responseArea.value = 'Creating account...';
            toggleLoader(true);

            try {
                const response = await fetch('/createAccount', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    responseArea.value = JSON.stringify(data.data, null, 2);
                    localStorage.setItem("createAccountResponse", JSON.stringify(data));

                    // Store account ID and redirect to enrollment page
                    const accountId = data.data.account.accountId;
                    window.location.href = `/getEnroll?accountId=${accountId}`;
                } else {
                    responseArea.value = 'Error: ' + JSON.stringify(data.error, null, 2);
                }
            } catch (err) {
                console.error('Error creating Account:', err);
                responseArea.value = 'Error: ' + err.message;
            } finally {
                toggleLoader(false);
            }
        }
    </script>
</body>

</html>
